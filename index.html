<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Das Farbenzimmer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bebas+Neue&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one play column — prompt card, the illustrated room (always light so colours read true), paint-pot palette. Menus replace the palette, never cover the room. */
:root{
  --bg:#f6f1fb; --surface:#ffffff; --ink:#2b2533; --muted:#6e6178; --line:#e2d8ef;
  --accent:#a347ad; --accent-ink:#ffffff; --accent-soft:#ffe8e8; --track:#e6dcf2;
  --peach:#fde3c0; --peach-ink:#6b4310; --lilac:#c08fc8;
  --good:#167a46; --bad:#c42b37;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --heading:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1522; --surface:#261e2f; --ink:#f4eef8; --muted:#b9a9c6; --line:#3d3049;
  --accent:#c08fc8; --accent-ink:#1b1522; --accent-soft:#3a2a44; --track:#35283f;
  --good:#4fd08b; --bad:#ff7a83; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b1522; --surface:#261e2f; --ink:#f4eef8; --muted:#b9a9c6; --line:#3d3049;
  --accent:#c08fc8; --accent-ink:#1b1522; --accent-soft:#3a2a44; --track:#35283f;
  --good:#4fd08b; --bad:#ff7a83; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.game{margin:0 auto;width:100%;max-width:max(340px,min(880px,calc((100dvh - 290px) * 1.6)));display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
h1 span{color:var(--accent)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:clamp(52px,12vw,72px);height:auto;display:block}
.bname{display:block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--heading);font-weight:400;font-size:clamp(2.2rem,6.5vw,2.9rem);line-height:.95;margin:0;letter-spacing:.02em}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chipbtn[aria-pressed="false"]{color:var(--muted)}
button:focus-visible,.obj:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.prompt{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.combo{background:var(--peach);color:var(--peach-ink);border-radius:999px;padding:0 10px;font-size:.9rem}
.combo:empty{display:none}
.scoreval{font-size:1.25rem}
.ptext{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.9rem);line-height:1.15;margin:0;text-wrap:balance;min-height:1.2em}
.ptext .cw{white-space:nowrap}
.ptext .hidden-txt{color:var(--muted);letter-spacing:.2em}
.big{display:block;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05}
.timer{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
.timer div{height:100%;width:100%;background:var(--accent);border-radius:999px;transform-origin:left}
.timer.low div{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fb{margin:0;font-weight:700;min-height:1.45em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.pactions{display:flex;gap:6px;flex-wrap:wrap}
.small{font:inherit;font-size:.88rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
.small.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stage{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:#f3eef8}
#room{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.obj{cursor:pointer;outline:none}
.obj .pf{fill:url(#hatch);stroke:#2b2540;stroke-width:3;stroke-linejoin:round}
.obj .ps{stroke:#ddd6e8}
.obj:hover .pf{stroke-width:4}
.obj.shake{animation:shake .4s ease;transform-box:fill-box;transform-origin:center}
.obj.hint{animation:hint 1s ease-in-out infinite}
.obj.wow{animation:wow .45s ease;transform-box:fill-box;transform-origin:center}
@keyframes shake{20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes hint{50%{filter:drop-shadow(0 0 6px #ffcc00) drop-shadow(0 0 2px #ffcc00)}}
@keyframes wow{40%{transform:scale(1.08)}}
.lbl{font:700 14px var(--body);fill:#2b2540;stroke:#ffffff;stroke-width:4;paint-order:stroke;text-anchor:middle;pointer-events:none}
#labels{transition:opacity .2s}
@media (max-width:600px){.lbl{font-size:21px;stroke-width:6}}
.drop{animation:drop .65s ease-out forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pts{font:800 26px var(--display);fill:#2b2540;stroke:#fff;stroke-width:5;paint-order:stroke;text-anchor:middle;animation:pts .9s ease-out forwards;pointer-events:none}
@keyframes pts{to{transform:translateY(-40px);opacity:0}}

.palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (min-width:760px){.palette{grid-template-columns:repeat(12,minmax(0,1fr))}}
.pot{font:inherit;border:2px solid transparent;background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s ease}
.pot i{display:block;width:clamp(28px,7vw,38px);aspect-ratio:1;border-radius:50% 50% 46% 46%;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),0 0 0 1.5px rgba(0,0,0,.18)}
.pot span{font-size:.78rem;font-weight:700;line-height:1.1;white-space:nowrap}
.pot[aria-pressed="true"]{border-color:var(--accent);transform:translateY(-4px);background:var(--accent-soft)}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--heading);font-weight:400;font-size:clamp(2rem,6.5vw,2.6rem);line-height:1;letter-spacing:.02em;margin:0;text-wrap:balance}
.panel p{margin:0;max-width:62ch;color:var(--muted)}
.panel .lead{color:var(--ink);font-size:1.05rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.go{font-family:var(--display);font-weight:700;font-size:1.2rem;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 26px;cursor:pointer}
.alt{font:inherit;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.lv{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lv b{font-family:var(--display);font-size:1.05rem}
.lv small{color:var(--muted);font-size:.82rem}
.lv:hover{border-color:var(--accent)}
.result{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,3.6rem);line-height:1;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.95rem}
.facts b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.obj.shake,.obj.hint,.obj.wow,.drop,.pts{animation:none}.pot{transition:none}}
</style>

<script>
const NS='http://www.w3.org/2000/svg';
const COLORS=[
 {de:'rot',hex:'#e2343f'},{de:'orange',hex:'#f5822a'},{de:'gelb',hex:'#f7cf2d'},{de:'grün',hex:'#2faa5c'},
 {de:'blau',hex:'#2f62d6'},{de:'lila',hex:'#9a55c4'},{de:'rosa',hex:'#f59bc8'},{de:'braun',hex:'#8a5a36'},
 {de:'beige',hex:'#e6d3ae'},{de:'grau',hex:'#9b9ba4'},{de:'weiß',hex:'#ffffff'},{de:'schwarz',hex:'#26232e'}];
const HEX=Object.fromEntries(COLORS.map(c=>[c.de,c.hex]));
const OBJS=[
 {id:'uhr',n:'Uhr',g:'f',lab:[260,145]},{id:'lampe',n:'Lampe',g:'f',lab:[70,136]},
 {id:'sofa',n:'Sofa',g:'n',lab:[335,256]},{id:'katze',n:'Katze',g:'f',lab:[198,204]},
 {id:'hund',n:'Hund',g:'m',lab:[262,404]},{id:'teppich',n:'Teppich',g:'m',lab:[560,481]},
 {id:'tisch',n:'Tisch',g:'m',lab:[530,398]},{id:'laptop',n:'Laptop',g:'m',lab:[488,289]},
 {id:'buch',n:'Buch',g:'n',lab:[604,284]},{id:'stuhl',n:'Stuhl',g:'m',lab:[700,455]},
 {id:'tasche',n:'Tasche',g:'f',lab:[700,240]},{id:'blume',n:'Blume',g:'f',lab:[610,84]}];
const OB=Object.fromEntries(OBJS.map(o=>[o.id,o]));
const ART={m:'der',f:'die',n:'das'};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const sent=(o,c)=>`${cap(ART[o.g])} ${o.n} ist ${c}.`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=id=>document.getElementById(id);
const room=$('room');
const cw=c=>`<span class="cw">${c}</span>`;


/* storage-safe prefs */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let sound=store.get('fz-sound')!=='0';
let best=+(store.get('fz-best')||0);

/* audio */
let ac=null;
function tone(fr,type,dur,vol){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
 fr.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
 const s=t+i*dur;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol||.16,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
 o.connect(g).connect(ac.destination);o.start(s);o.stop(s+dur+.03)})}catch(e){}}
const sfx={ok:()=>tone([660,880,1175],'triangle',.09,.14),bad:()=>tone([220,165],'sawtooth',.13,.06),tick:()=>tone([1200],'square',.04,.03),fan:()=>tone([523,659,784,1046],'triangle',.13,.14)};
let deVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de(-|_|$)/i.test(x.lang))||null}catch(e){}}
loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(t,{queue=false,force=false}={}){if(!sound&&!force)return;try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
const canSpeak=()=>{try{return 'speechSynthesis' in window}catch(e){return false}};

/* room helpers */
const painted={};
function g(id){return $('o-'+id)}
function paint(id,c){painted[id]=c;g(id).querySelectorAll('.pf').forEach(e=>e.style.fill=c?HEX[c]:'');g(id).querySelectorAll('.ps').forEach(e=>e.style.stroke=c?HEX[c]:'')}
function clearRoom(){OBJS.forEach(o=>paint(o.id,null))}
function randomRoom(){const cs=shuffle(COLORS);OBJS.forEach((o,k)=>paint(o.id,cs[k].de))}
function anim(el,cls){el.classList.remove(cls);void el.getBBox();el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),500)}
function center(id){const b=g(id).getBBox();return{x:b.x+b.width/2,y:b.y+b.height/2}}
function splash(p,c){const grp=document.createElementNS(NS,'g');for(let k=0;k<11;k++){const a=Math.random()*Math.PI*2,d=22+Math.random()*34,ci=document.createElementNS(NS,'circle');
 ci.setAttribute('cx',p.x);ci.setAttribute('cy',p.y);ci.setAttribute('r',4+Math.random()*6);ci.setAttribute('fill',HEX[c]);ci.setAttribute('stroke','rgba(0,0,0,.25)');ci.setAttribute('stroke-width','1.5');
 ci.setAttribute('class','drop');ci.style.setProperty('--dx',Math.cos(a)*d+'px');ci.style.setProperty('--dy',Math.sin(a)*d+'px');grp.appendChild(ci)}
 $('fx').appendChild(grp);setTimeout(()=>grp.remove(),750)}
function floatPts(p,txt){const t=document.createElementNS(NS,'text');t.setAttribute('x',p.x);t.setAttribute('y',p.y-10);t.setAttribute('class','pts');t.textContent=txt;$('fx').appendChild(t);setTimeout(()=>t.remove(),950)}
function svgPt(e){if(e.clientX==null||(e.clientX===0&&e.clientY===0))return null;const p=room.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(room.getScreenCTM().inverse())}

/* labels + hit areas */
OBJS.forEach(o=>{const el=g(o.id),b=el.getBBox(),r=document.createElementNS(NS,'rect'),pd=o.id==='tasche'?0:8;
 r.setAttribute('x',b.x-pd);r.setAttribute('y',b.y-pd);r.setAttribute('width',b.width+2*pd);r.setAttribute('height',b.height+2*pd);r.setAttribute('fill','transparent');el.insertBefore(r,el.firstChild);
 el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',`${ART[o.g]} ${o.n}`);
 const t=document.createElementNS(NS,'text');t.setAttribute('x',o.lab[0]);t.setAttribute('y',o.lab[1]);t.setAttribute('class','lbl');t.textContent=`${ART[o.g]} ${o.n}`;$('labels').appendChild(t)});
let labelsOn=true;
function setLabels(on){labelsOn=on;$('labels').style.opacity=on?1:0;const b=$('lblBtn');b.setAttribute('aria-pressed',on);b.textContent='Wörter: '+(on?'an':'aus')}

/* palette */
let sel=null;
$('palette').innerHTML=COLORS.map(c=>`<button class="pot" data-c="${c.de}" aria-pressed="false" aria-label="Farbe ${COLORS.indexOf(c)+1}"><i style="background:${c.hex}"></i></button>`).join('');
function select(c){sel=c;document.querySelectorAll('.pot').forEach(p=>p.setAttribute('aria-pressed',p.dataset.c===c));tone([520+COLORS.findIndex(x=>x.de===c)*40],'sine',.07,.08)}
$('palette').addEventListener('click',e=>{const p=e.target.closest('.pot');if(p)select(p.dataset.c)});

/* game state */
const S={mode:'menu',level:0,plan:null,tasks:[],ti:0,task:null,tries:0,score:0,combo:0,firstTry:0,done:0,mistakes:0,hits:0,misses:0,lock:false,revealed:false,queue:[],target:null,tEnd:0,raf:0,spoke:false,fromStart:false};
const LV={
 1:{name:'Lesen und malen',txt:'Lies den Satz. Wähle die Farbe unten und tippe dann auf das richtige Ding im Zimmer.'},
 2:{name:'Hören und malen',txt:'Jetzt gibt es keinen Text. Hör gut zu und male. Mit „Nochmal hören“ hörst du den Satz noch einmal.'}};

function ui(mode){S.mode=mode;$('panel').hidden=mode!=='panel';$('prompt').hidden=mode==='panel';$('palette').hidden=!(mode==='task'||mode==='free');$('timer').hidden=mode!=='l3'}
function setScore(){$('score').textContent=S.score+' P';$('combo').textContent=S.combo>=2?'Combo ×'+Math.min(S.combo,5):''}
function fb(t,cls){const f=$('fb');f.textContent=t;f.className='fb '+(cls||'')}
function actions(list){$('pactions').innerHTML=list.map(([id,label,pri])=>`<button class="small${pri?' primary':''}" id="${id}">${label}</button>`).join('');
 list.forEach(([id,,,fn])=>$(id).onclick=fn)}
function stopTimer(){cancelAnimationFrame(S.raf);S.raf=0}

/* MENU */
function menu(){stopTimer();try{speechSynthesis.cancel()}catch(e){}
 document.querySelectorAll('.obj.hint').forEach(e=>e.classList.remove('hint'));
 ui('panel');setLabels(true);
 $('panel').innerHTML=`<h2>Mal das Zimmer bunt!</h2>
 <p class="lead">Zwei Level: lesen und hören. Für jede richtige Farbe gibt es Punkte, für Serien eine Combo.</p>
 <div class="btns"><button class="go" id="startBtn">Spiel starten</button></div>
 <p>Oder direkt zu einem Level:</p>
 <div class="levels">
  <button class="lv" data-l="1"><b>1 · Lesen und malen</b><small>Satz lesen, Farbe wählen, malen</small></button>
  <button class="lv" data-l="2"><b>2 · Hören und malen</b><small>Satz nur hören</small></button>
 </div>${best?`<p>Rekord auf diesem Gerät: <b>${best} Punkte</b></p>`:''}`;
 $('startBtn').onclick=()=>newGame(1,true);
 $('panel').querySelectorAll('.lv').forEach(b=>b.onclick=()=>b.dataset.l==='free'?free():newGame(+b.dataset.l,false));
}
function newGame(level,fromStart){S.score=0;S.combo=0;S.firstTry=0;S.done=0;S.mistakes=0;S.hits=0;S.misses=0;S.fromStart=fromStart;
 const cs=shuffle(COLORS),os=shuffle(OBJS);S.plan=os.map((o,k)=>({o,c:cs[k].de}));
 clearRoom();intro(level)}
function intro(level){ui('panel');const L=LV[level];
 let note='';if(level===2&&(!canSpeak()||!deVoice))note='<p>Auf diesem Gerät gibt es keine deutsche Stimme. Der Satz steht deshalb als Text da.</p>';
 if(level===2&&!sound)note='<p>Der Ton ist aus. Mach ihn oben an, sonst steht der Satz als Text da.</p>';
 $('panel').innerHTML=`<span class="eyebrow">Level ${level} von 2</span><h2>${L.name}</h2><p class="lead">${L.txt}</p>${note}<div class="btns"><button class="go" id="goBtn">Los!</button><button class="alt" id="menuBtn">Menü</button></div>`;
 $('goBtn').onclick=()=>begin(level);$('menuBtn').onclick=menu;$('goBtn').focus({preventScroll:true})}

/* LEVEL 1 + 2 */
function begin(level){S.level=level;setScore();
 S.tasks=level===1?S.plan.slice(0,6):S.plan.slice(6);S.ti=0;setLabels(level===1);ui('task');nextTask()}
function nextTask(){document.querySelectorAll('.obj.hint').forEach(e=>e.classList.remove('hint'));
 if(S.ti>=S.tasks.length)return levelDone();
 S.task=S.tasks[S.ti];S.tries=0;S.lock=false;fb('');
 S.revealed=S.level===1||!sound||!canSpeak()||!deVoice;
 $('eyebrow').textContent=`Level ${S.level} · Aufgabe ${S.ti+1} von ${S.tasks.length}`;
 renderTask();
 if(S.level===2)setTimeout(()=>speak(sent(S.task.o,S.task.c),{queue:true}),S.ti?650:250);
}
function renderTask(){const t=S.task;
 $('ptext').innerHTML=S.revealed?`${cap(ART[t.o.g])} ${t.o.n} ist ${cw(t.c)}.`:'<span class="hidden-txt">· · · · · ·</span>';
 const a=[['hearBtn',S.level===2?'Nochmal hören':'Anhören',S.level===2,()=>speak(sent(t.o,t.c),{force:true})]];
 if(!S.revealed)a.push(['showBtn','Text zeigen',false,()=>{S.revealed=true;S.combo=0;setScore();renderTask()}]);
 a.push(['menuBtn2','Menü',false,menu]);actions(a)}
function taskTap(id,p){if(S.lock)return;const t=S.task,o=OB[id];
 if(!sel){fb('Wähle zuerst unten eine Farbe.','no');sfx.bad();return}
 if(id===t.o.id&&sel===t.c){S.lock=true;paint(id,sel);splash(p||center(id),sel);anim(g(id),'wow');sfx.ok();
  let pts;if(S.tries===0){S.combo++;S.firstTry++;pts=100*Math.min(S.combo,5)}else{S.combo=0;pts=50}
  S.score+=pts;S.done++;setScore();floatPts(p||center(id),'+'+pts);
  S.revealed=true;renderTask();fb(S.tries===0?'Richtig!':'Richtig, jetzt passt es!','ok');speak(sent(t.o,t.c));
  setTimeout(()=>{S.ti++;nextTask()},S.level===2?1500:1000);return}
 S.tries++;S.mistakes++;S.combo=0;setScore();sfx.bad();anim(g(id),'shake');
 if(id!==t.o.id){fb(S.level===1?`Das ist ${ART[o.g]} ${o.n}. Gesucht: ${ART[t.o.g]} ${t.o.n}.`:`Das ist ${ART[o.g]} ${o.n}. Hör noch einmal!`,'no')}
 else fb(S.level===1?`Das ist ${sel}. Wir brauchen ${t.c}.`:`Das richtige Ding, aber nicht ${sel}. Hör noch einmal!`,'no');
 if(S.level===2){if(S.tries>=2&&!S.revealed){S.revealed=true;renderTask()}else speak(sent(t.o,t.c),{queue:false})}
 if(S.level===1&&S.tries>=2)g(t.o.id).classList.add('hint');
}
function levelDone(){if(S.level===2)return endGame();ui('panel');sfx.fan();const L=S.level;
 $('panel').innerHTML=`<span class="eyebrow">Level ${L} geschafft</span><h2>${L===1?'Super gelesen!':'Super gehört!'}</h2>
 <div class="facts"><span>Punkte: <b>${S.score}</b></span><span>Ohne Fehler: <b>${S.firstTry} von ${S.done}</b></span></div>
 <div class="btns"><button class="go" id="goBtn">Weiter zu Level ${L+1}</button><button class="alt" id="menuBtn">Menü</button></div>`;
 $('goBtn').onclick=()=>intro(L+1);$('menuBtn').onclick=menu;$('goBtn').focus({preventScroll:true})}

/* END */
function endGame(){try{speechSynthesis.cancel()}catch(e){}sfx.fan();
 const rec=S.score>best;if(rec){best=S.score;store.set('fz-best',best)}
 ui('panel');const perfect=S.done&&S.firstTry===S.done;
 $('panel').innerHTML=`<span class="eyebrow">Spiel vorbei</span><h2>${rec?'Neuer Rekord!':perfect?'Fantastisch!':S.firstTry>=S.done-3?'Sehr gut!':'Gut gemacht!'}</h2>
 <div class="result">${S.score} Punkte</div>
 <div class="facts"><span>Ohne Fehler: <b>${S.firstTry} von ${S.done}</b></span><span>Fehler: <b>${S.mistakes}</b></span><span>Rekord: <b>${best}</b></span></div>
 <p>Tipp: Zeig auf das Zimmer und beschreib es laut. „Das Sofa ist ${painted.sofa||'blau'}. Der Hund ist ${painted.hund||'braun'}.“</p>
 <div class="btns"><button class="go" id="againBtn">Nochmal spielen</button><button class="alt" id="freeBtn">Freies Malen</button><button class="alt" id="menuBtn">Menü</button></div>`;
 $('againBtn').onclick=()=>newGame(1,true);$('freeBtn').onclick=free;$('menuBtn').onclick=menu;$('againBtn').focus({preventScroll:true})}

/* FREE */
function free(){stopTimer();ui('free');S.combo=0;setLabels(true);fb('');
 $('eyebrow').textContent='Freies Malen';$('score').textContent='';$('combo').textContent='';
 $('ptext').innerHTML='Wähle eine Farbe und male, was du willst!';
 actions([['clearBtn','Zimmer leeren',false,()=>{clearRoom();fb('')}],['rndBtn','Zufallsfarben',false,()=>{randomRoom();sfx.fan()}],['menuBtn2','Menü',true,menu]])}
function freeTap(id,p){const o=OB[id];
 if(sel){paint(id,sel);splash(p||center(id),sel);anim(g(id),'wow');}
 const c=painted[id];
 if(c){$('ptext').innerHTML=`${cap(ART[o.g])} ${o.n} ist ${cw(c)}.`;fb('Sag den Satz laut!','ok');speak(sent(o,c))}
 else{$('ptext').innerHTML=`Das ist ${ART[o.g]} ${o.n}.`;fb('Wähle eine Farbe!','');speak(`Das ist ${ART[o.g]} ${o.n}.`)}}

/* input */
function tap(id,p){if(S.mode==='task')taskTap(id,p);else if(S.mode==='free')freeTap(id,p);
 else{const o=OB[id];speak(`${ART[o.g]} ${o.n}`)}}
room.addEventListener('click',e=>{const el=e.target.closest('.obj');if(el)tap(el.id.slice(2),svgPt(e))});
room.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('obj')){e.preventDefault();tap(e.target.id.slice(2),null)}});
$('lblBtn').onclick=()=>setLabels(!labelsOn);
function syncSound(){const b=$('soundBtn');b.setAttribute('aria-pressed',sound);b.textContent='Ton: '+(sound?'an':'aus')}
$('soundBtn').onclick=()=>{sound=!sound;store.set('fz-sound',sound?'1':'0');syncSound();if(!sound)try{speechSynthesis.cancel()}catch(e){}};
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
syncSound();

/* idle: preview room with a few colours so the first frame shows what the game is */
paint('sofa','blau');paint('katze','orange');paint('blume','rot');paint('teppich','gelb');
menu();
</script>

</body></html>
